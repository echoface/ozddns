# OzDDNS — single-container deployment.
#
# Networking: the container uses host networking by default so "interface" IP
# sources can read the *host's* NICs — a bridged container only ever sees its
# own veth pair, never en0/eth0 on the host. Because there is no port mapping in
# host mode, the panel is exposed by OZDDNS_LISTEN instead; it stays on loopback
# (127.0.0.1) so only this host can reach it. If you intentionally expose it on
# 0.0.0.0:9876, enable authorization in Settings > Security (password + TOTP)
# before allowing remote traffic.
#
# Host networking is Linux-only. On Docker Desktop (macOS/Windows) either enable
# host networking in settings, or drop network_mode, restore the ports mapping
# below and switch OZDDNS_LISTEN back to 0.0.0.0:9876 — interface IP sources will
# then only see the container's own interfaces.
#
# Binding beyond loopback on a *private* network you control (a LAN, or an
# overlay such as Tailscale) without authorization is allowed, but the daemon
# warns because it cannot tell the difference from a public bind. Assert it with
# OZDDNS_TRUSTED_NETWORK=true to silence the warning and panel banner. Never use
# it for a bind that is reachable from the public internet.
#
# The listen address is deployment config: it comes from OZDDNS_LISTEN (below),
# the --listen flag, or config.yaml — not from the panel/database. Under host
# networking the port comes only from OZDDNS_LISTEN (there is no ports mapping).
#
# The image is the published multi-arch build. Pin a version for reproducible
# deployments, e.g. OZDDNS_IMAGE=ghcr.io/echoface/ozddns:1.1.0 docker compose up -d
# "docker compose up -d --build" builds the same image locally instead.
#
# On first start the container writes a default config.yaml to the data volume
# (./data/config.yaml) that you can edit; it is read on the next restart.
services:
  ozddns:
    image: ${OZDDNS_IMAGE:-ghcr.io/echoface/ozddns:latest}
    build: .
    # Prefer the published image when it is not present locally; use
    # "docker compose up -d --build" to build from this checkout instead.
    pull_policy: missing
    container_name: ozddns
    restart: unless-stopped
    network_mode: host
    # Bridged mode instead (no host NIC access):
    # ports:
    #   - "127.0.0.1:9876:9876"
    volumes:
      - ./data:/data
    environment:
      OZDDNS_DB: /data/ozddns.db
      OZDDNS_LISTEN: 127.0.0.1:9876
      # Silence the beyond-loopback exposure warning when OZDDNS_LISTEN is a
      # private/overlay address you control (e.g. a Tailscale 100.64.x.x):
      # OZDDNS_TRUSTED_NETWORK: "true"
      # Mount the panel under a reverse-proxy sub-path (see docs/nginx.md):
      # OZDDNS_BASE_PATH: /ddns
      TZ: Asia/Shanghai
    command: ["--db", "/data/ozddns.db", "serve"]
