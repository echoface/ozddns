# OzDDNS on its own domain: https://ddns.example.com/
#
# Start-up setting: none (basePath defaults to "/").
# The daemon keeps its loopback bind; only nginx is exposed.

upstream ozddns {
    server 127.0.0.1:9876;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name ddns.example.com;

    # Everything except the ACME challenge goes to HTTPS. Adjust or delete if
    # TLS terminates somewhere else in front of this host.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx < 1.25.1: use "listen 443 ssl http2;"
    server_name ddns.example.com;

    ssl_certificate     /etc/letsencrypt/live/ddns.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ddns.example.com/privkey.pem;

    # The panel uploads a JSON config on import; 1m (nginx default) can be tight.
    client_max_body_size 8m;

    # The request URI is forwarded untouched: no prefix rewriting, no rewrites
    # at all. A root mount needs none, and the daemon issues its own canonical
    # redirects.
    location / {
        proxy_pass http://ozddns;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
