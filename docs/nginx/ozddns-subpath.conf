# OzDDNS under a sub-path of a shared domain: https://app.example.com/ddns/
#
# Start-up setting:  ozddns serve --base-path /ddns
#                    (or OZDDNS_BASE_PATH=/ddns, or "basePath: /ddns" in config.yaml)
# Add --trust-proxy when every request reaches the daemon through this proxy;
# the block below overwrites both forwarding headers.
#
# No rebuild and no build argument: the published image serves any mount point.
# The daemon strips the prefix itself, so this block forwards the request
# untouched and coexists with the rest of the site.

location /ddns {
    # Matches both /ddns and /ddns/... and passes the URI through unchanged --
    # no trailing slash on proxy_pass, no rewrite. The daemon owns the prefix: it
    # strips /ddns before routing, and redirects /ddns to /ddns/ itself.
    #
    # Do NOT "strip" the prefix here (proxy_pass http://127.0.0.1:9876/;). The
    # daemon expects the public path; the stripped form would leave it looking
    # for /ddns/api/v1/... , which is not a route.
    proxy_pass http://127.0.0.1:9876;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # OzDDNS trusts the first address when --trust-proxy is enabled, so this
    # proxy must overwrite a client-supplied X-Forwarded-For value.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # The panel uploads a JSON config on import; 1m (nginx default) can be tight.
    client_max_body_size 8m;
}
